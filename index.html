body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;

}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.7);
  padding: 15px;
  text-align: center;
  z-index: 1000;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1599661046289-e31897846e41?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.hero img {
  width: 160px;
  margin-bottom: 20px;
  border-radius: 10px;
}

.hero h1 {
  font-size: 2.5rem;
}

/* SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

/* GALLERY */
.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
}

.gallery a:first-child img {
  grid-column: span 2;
  height: 300px;
}

/* BUTTON */
.btn {
  background: gold;
  color: black;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

footer {
  padding: 20px;
  background: black;
}
</style>
